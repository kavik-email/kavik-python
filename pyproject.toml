[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kavikemail"
version = "1.0.0"
description = "Official Python SDK for the Kavik.email email verification API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]
keywords = [
    "email",
    "verification",
    "validation",
    "api",
    "sdk",
    "kavik",
    "kavikemail",
    "email-validation",
    "email-verification",
    "disposable-email",
    "smtp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://kavik.email"
Repository = "https://github.com/kavik-email/kavik-python"
Documentation = "https://kavik.email/docs/sdks/"
Issues = "https://github.com/kavik-email/kavik-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["kavikemail"]

[tool.hatch.build.targets.sdist]
include = ["/kavikemail", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
