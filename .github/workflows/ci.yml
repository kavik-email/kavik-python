name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9 has no build for Ubuntu 26.04, so the test job stays on 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      # tests/test_live.py needs a real key, so CI runs the unit tests only.
      - run: python -m pytest tests/test_client.py tests/test_http.py tests/test_models.py tests/test_webhook.py -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
